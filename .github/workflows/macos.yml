# Compile SXM Mail pour macOS sur les Mac de GitHub, et fournit le .dmg à télécharger.
# Lancement : onglet « Actions » du dépôt → « Build macOS » → « Run workflow »
# (ou automatiquement à chaque envoi sur la branche main, ou avec une étiquette v0.x.y).
name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Binaire « universel » : fonctionne sur les Mac Intel (ex. MacBook Pro 2019) et Apple Silicon.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Outil de build Tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Tests du cœur
        run: cargo test --manifest-path core/Cargo.toml

      - name: Compilation de l'application
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SXM-Mail-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Page « Releases » publique : lien de téléchargement sans connexion à GitHub.
      - name: Numéro de version
        id: v
        run: echo "version=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Publication sur la page Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: SXM Mail ${{ steps.v.outputs.version }}
          body: "Version macOS (universelle : Mac Intel et Apple Silicon). Non signée par Apple : au premier lancement, Réglages Système → Confidentialité et sécurité → Ouvrir quand même."
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
