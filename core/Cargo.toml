[package]
name = "sxm-core"
version = "0.1.0"
edition = "2021"
description = "Cœur de SXM Mail : OAuth2, comptes, IMAP (sans dépendance à Tauri)"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
dirs = "5"
imap = "2.4.1"
native-tls = "0.2"
mailparse = "0.15"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }

# Trousseau système : Secret Service (GNOME Keyring / KWallet) sous Linux, Trousseau d'accès sous macOS.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
