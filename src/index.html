<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SXM Mail</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="backdrop" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect class="f0" width="1440" height="900"/>
  <path class="f1" d="M0 0 L520 0 L260 380Z"/><path class="f2" d="M520 0 L1100 0 L760 300Z"/>
  <path class="f3" d="M1100 0 L1440 0 L1440 420Z"/><path class="f4" d="M0 380 L260 380 L0 900Z"/>
  <path class="f5" d="M260 380 L760 300 L560 900 L0 900Z"/><path class="f6" d="M760 300 L1440 420 L1440 900 L560 900Z"/>
  <path class="f7" d="M1100 0 L760 300 L1440 420Z"/>
</svg>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7.5 8.5 6 8.5-6"/></svg>
      </div>
      <div><strong>SXM Mail</strong><small id="app-version">v0.3.0</small></div>
    </div>
    <div class="search">
      <svg class="search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="q" class="sr-only">Rechercher</label>
      <input id="q" type="search" placeholder="Rechercher" autocomplete="off">
    </div>
    <div class="top-actions">
      <button type="button" id="btn-refresh" class="icon-btn btn-refresh" aria-label="Actualiser" title="Actualiser (F5)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button type="button" id="btn-updates" class="icon-btn btn-updates" aria-label="Rechercher des mises à jour" title="Rechercher des mises à jour">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
        <span class="upd-dot" hidden></span>
      </button>
      <button type="button" id="btn-theme" class="icon-btn" aria-label="Changer de thème" title="Thème clair / sombre">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </header>

  <div class="ribbon" role="toolbar" aria-label="Actions">
    <button class="btn-compose" id="btn-compose" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Nouveau courrier
    </button>
    <span class="ribbon-sep" aria-hidden="true"></span>
    <div class="toolbar" id="toolbar"></div>
  </div>

  <div class="app">
    <nav class="sidebar pane" aria-label="Comptes et dossiers">
      <div class="side-title">Dossiers</div>
      <div id="folders" class="folders"></div>
      <div class="side-title with-btn">Mes dossiers
        <button type="button" class="mini-add" id="btn-new-folder" aria-label="Nouveau dossier" title="Nouveau dossier"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div id="user-folders" class="folders"></div>
      <div class="side-title">Comptes</div>
      <div id="accounts" class="accounts"></div>
      <div class="spacer"></div>
      <button class="btn-add" id="btn-add-account" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ajouter un compte</button>
      <div class="side-art" aria-hidden="true">
        <svg viewBox="0 0 220 120">
          <defs><linearGradient id="env-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
          <circle cx="30" cy="30" r="5" fill="#F472B6"/><circle cx="196" cy="58" r="4" fill="#34D399"/><circle cx="48" cy="58" r="3" fill="#FBBF24"/>
          <path class="wave1" d="M0 82 C50 56 90 92 140 70 S200 48 220 60 V120 H0z"/>
          <path class="wave2" d="M0 98 C60 80 120 110 220 90 V120 H0z"/>
          <g transform="translate(64 10) rotate(-12 46 34)">
            <rect x="0" y="6" width="92" height="62" rx="10" fill="url(#env-grad)"/>
            <path d="M6 14 46 42 86 14" fill="none" stroke="#CFE0FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="46" y="62" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="13" fill="#fff">SXM</text>
          </g>
          <circle cx="168" cy="22" r="11" fill="#F8D66B"/>
        </svg>
        <p>Une boîte, tous tes comptes.</p>
      </div>
      <button type="button" class="side-version" id="btn-check-update" title="Rechercher des mises à jour">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span>Rechercher des mises à jour</span>
      </button>
    </nav>

    <section class="list pane" aria-label="Liste des messages">
      <div id="tabs" class="tabs"></div>
      <div id="messages" class="messages"></div>
    </section>

    <main class="reader" aria-label="Lecture">
      <article id="reading" class="reading pane"></article>
    </main>
  </div>
</div>

<dialog id="compose" aria-labelledby="compose-title">
  <form method="dialog" id="compose-form">
    <h2 id="compose-title">Nouveau message</h2>
    <label for="c-from">De</label><select id="c-from"></select>
    <label for="c-to">À</label><input id="c-to" type="email" placeholder="destinataire@exemple.com">
    <label for="c-subj">Objet</label><input id="c-subj" type="text">
    <label for="c-body">Message</label><textarea id="c-body" rows="10"></textarea>
    <div class="c-atts" id="c-atts" aria-live="polite"></div>
    <input type="file" id="c-file" multiple hidden>
    <p class="drop-hint" id="drop-hint" hidden>Dépose les fichiers ici pour les joindre</p>
    <div class="dialog-actions">
      <button type="button" class="btn-attach" id="c-attach" title="Joindre des fichiers (ou glisse-les sur la fenêtre)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7L10 17.4a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>
        Joindre un fichier
      </button>
      <span class="spacer-x"></span>
      <button value="cancel" type="submit" class="btn-ghost">Annuler</button>
      <button id="c-send" type="button" class="btn-primary">Envoyer</button>
    </div>
  </form>
</dialog>

<dialog id="add-dialog" aria-labelledby="add-title">
  <h2 id="add-title">Ajouter un compte</h2>
  <div class="add-choices">
    <button type="button" class="btn-primary" data-provider="google">Gmail</button>
  </div>
  <div class="dialog-actions"><button id="add-cancel" type="button" class="btn-ghost">Annuler</button></div>
</dialog>

<dialog id="info" aria-labelledby="info-title">
  <h2 id="info-title"></h2>
  <p id="info-text" class="info-text"></p>
  <div class="dialog-actions"><button id="info-close" type="button" class="btn-primary">OK</button></div>
</dialog>

<dialog id="file-dialog" aria-labelledby="file-title">
  <h2 id="file-title">Classer dans un dossier</h2>
  <p class="dlg-sub" id="file-sub"></p>
  <div class="chip-list" id="file-folders"></div>
  <label for="file-new">Ou crée un nouveau dossier</label>
  <div class="inline-field">
    <input id="file-new" type="text" maxlength="100" placeholder="Nom du dossier (ex. le nom de la personne)">
    <button type="button" class="btn-primary" id="file-create">Créer et classer</button>
  </div>
  <label class="check"><input type="checkbox" id="file-rule"> <span id="file-rule-label">Toujours classer les mails de cette personne dans ce dossier</span></label>
  <div class="dialog-actions"><button type="button" class="btn-ghost" id="file-cancel">Annuler</button></div>
</dialog>

<dialog id="folder-dialog" aria-labelledby="folder-title">
  <h2 id="folder-title">Nouveau dossier</h2>
  <label for="folder-name">Nom du dossier</label>
  <input id="folder-name" type="text" maxlength="100" placeholder="Ex. Famille, Hôtel, Marie…">
  <label for="folder-acct">Dans le compte</label>
  <select id="folder-acct"></select>
  <p class="dlg-hint">Le dossier est créé dans Gmail (sous forme de libellé) : tu le retrouves aussi sur ton téléphone.</p>
  <div class="dialog-actions">
    <button type="button" class="btn-ghost" id="folder-cancel">Annuler</button>
    <button type="button" class="btn-primary" id="folder-ok">Créer</button>
  </div>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2>
  <p id="confirm-text" class="info-text"></p>
  <div class="dialog-actions">
    <button type="button" class="btn-ghost" id="confirm-no">Annuler</button>
    <button type="button" class="btn-danger" id="confirm-yes">Confirmer</button>
  </div>
</dialog>

<aside id="upd" class="upd" role="dialog" aria-labelledby="upd-title" hidden>
  <div class="upd-head">
    <span class="upd-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></span>
    <div class="upd-text"><strong id="upd-title"></strong><small id="upd-sub"></small></div>
    <button type="button" class="upd-x" id="upd-close" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <button type="button" class="upd-toggle" id="upd-toggle" aria-expanded="false" aria-controls="upd-list"><span id="upd-toggle-label">Voir les nouveautés</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="upd-list" id="upd-list"></div>
  <div class="upd-bar" id="upd-bar" hidden><div id="upd-fill"></div></div>
  <p class="upd-status" id="upd-status" hidden></p>
  <div class="upd-actions" id="upd-actions">
    <button type="button" class="btn-ghost" id="upd-later">Plus tard</button>
    <button type="button" class="btn-primary" id="upd-go">Mettre à jour</button>
  </div>
  <div class="upd-actions" id="upd-restart-row" hidden><button type="button" class="btn-primary" id="upd-restart">Redémarrer SXM Mail</button></div>
</aside>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
<script src="update.js"></script>
</body>
</html>
